name: DEBTECO isolated full acceptance

on:
  push:
    branches: [qa/debteco-acceptance-20261112]

permissions:
  contents: read

concurrency:
  group: debteco-acceptance-20261112
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PROJECT: /home/sergey/Projects/DPECO-hover-final-20261112
      SOURCE_LOCAL_COMMIT: 3b0ff5e9aabd13450fc02cec276d2b73a35a2ad0
      SOURCE_TREE: 258e2f9106ebc50528936f905f41bd7d89b536c9
      PREVIEW_SHA256: 3b4a7efe33f4a52c957a8422863301bfe7f752d92feb432b1f385a85972de736
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - name: Prepare exact project paths and original preview
        run: |
          set -euo pipefail
          sudo install -d -m 0755 -o "$(id -un)" -g "$(id -gn)" /home/sergey/Projects /opt/imon-runtime/node/bin /home/sergey/.local/share/imon-toolkit/node
          ln -s "$(command -v node)" /opt/imon-runtime/node/bin/node
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          project = pathlib.Path(os.environ['PROJECT'])
          assert not project.exists(), 'Refusing to reuse an existing project directory'
          git = lambda *args: subprocess.check_output(['git', '-C', str(workspace), *args], text=True).strip()
          assert git('rev-parse', 'HEAD^{tree}') != os.environ['SOURCE_TREE']
          assert git('rev-parse', 'HEAD^1^{tree}') == os.environ['SOURCE_TREE'], 'CI parent is not the exact source snapshot'
          changes = git('diff', '--name-status', '--no-renames', 'HEAD^1', 'HEAD').splitlines()
          assert set(changes) == {'A\t.github/workflows/debteco-acceptance-20261112.yml', 'A\t.github/ci/debteco-acceptance-20261112-preview.json'}, changes
          shutil.copytree(workspace, project, ignore=shutil.ignore_patterns('.git'))
          results = project / 'qa/homepage/results'
          results.mkdir(parents=True, exist_ok=True)
          original = workspace / '.github/ci/debteco-acceptance-20261112-preview.json'
          preview = results / 'preview.json'
          shutil.copyfile(original, preview)
          assert hashlib.sha256(preview.read_bytes()).hexdigest() == os.environ['PREVIEW_SHA256']
          assert json.loads(preview.read_bytes())['createdAt'] == '2026-11-12T15:13:56.241632+00:00'
          origin = {
              'sourceLocalCommit': os.environ['SOURCE_LOCAL_COMMIT'],
              'sourceTree': os.environ['SOURCE_TREE'],
              'sourceSnapshotCommit': git('rev-parse', 'HEAD^1'),
              'workflowCommit': git('rev-parse', 'HEAD'),
              'workflowRef': os.environ.get('GITHUB_REF'),
              'runId': os.environ.get('GITHUB_RUN_ID'),
              'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'runnerName': os.environ.get('RUNNER_NAME'),
              'runnerOs': os.environ.get('RUNNER_OS'),
              'runnerArch': os.environ.get('RUNNER_ARCH'),
              'imageOs': os.environ.get('ImageOS'),
              'imageVersion': os.environ.get('ImageVersion'),
              'project': str(project),
              'previewSha256': os.environ['PREVIEW_SHA256'],
              'previewCreatedAt': json.loads(preview.read_bytes())['createdAt'],
          }
          (results / 'ci-origin.json').write_text(json.dumps(origin, indent=2) + '\n')
          print(json.dumps(origin, indent=2))
          PY

      - name: Install pinned runtimes and rebuild
        working-directory: /home/sergey/Projects/DPECO-hover-final-20261112
        run: |
          set -euo pipefail
          {
            test "$(/opt/imon-runtime/node/bin/node --version)" = "v24.21.0"
            node --version
            npm --version
            npm ci
            npm run build
            npm install --prefix /home/sergey/.local/share/imon-toolkit/node --no-audit --no-fund --ignore-scripts playwright@1.58.2
            /opt/imon-runtime/node/bin/node -e "if (require('/home/sergey/.local/share/imon-toolkit/node/node_modules/playwright/package.json').version !== '1.58.2') process.exit(1)"
            /opt/imon-runtime/node/bin/node /home/sergey/.local/share/imon-toolkit/node/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
            /opt/imon-runtime/node/bin/node /home/sergey/.local/share/imon-toolkit/node/node_modules/playwright/cli.js --version
          } 2>&1 | tee qa/homepage/results/ci-setup-build.log

      - name: Verify all candidate inputs and all 107 built files before QA
        working-directory: /home/sergey/Projects/DPECO-hover-final-20261112
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/debteco-ci-verify.py" <<'PY'
          import datetime, hashlib, importlib.util, json, os, pathlib, platform, subprocess, sys
          sys.dont_write_bytecode = True
          project = pathlib.Path(os.environ['PROJECT'])
          expected_qa = {
              "qa/homepage/check-client-review.mjs": "cef36e2bc3b703358cddaea421a6b2b438b9b0308d24d81eb2023d75f2ce160b",
              "qa/homepage/check-client-part2.mjs": "a67c85930521ce32ca980b20937a767e63d18e5f808ab80736cc2f068f7b9c80",
              "qa/homepage/run-client-review-suite.py": "e0a2902dd0c6bf57c843957084ab54efb757485b4612405f74a0dd796db1aec8",
              "qa/homepage/publish-server.py": "7dff5609eca4ef58fa2bdc5d430c261d79cf39f6f1dd54addf26ed6464d17c67",
              "qa/homepage/publish-lab.py": "f96ac5f6f6f500e56233780489e4c1df4bb193563deef6d977fa941dd3680fe2",
              "qa/homepage/verify-lab.py": "644a0bab0583bfa7067b138c50fe140a393ab24cd28f8654967e55da6c05581c"
          }
          for name, expected in expected_qa.items():
              actual = hashlib.sha256((project / name).read_bytes()).hexdigest()
              assert actual == expected, f'QA/gate SHA mismatch: {name}'
          spec = importlib.util.spec_from_file_location('debteco_unchanged_gate', project / 'qa/homepage/publish-server.py')
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          fd = os.open(project, os.O_RDONLY | os.O_DIRECTORY)
          try:
              with gate.directory(fd, 'src') as directory:
                  source = gate.scan(directory, 'src')
              source.update({name: gate.sha(gate.read(fd, name)) for name in ('index.html', 'vite.config.ts', 'package.json', 'package-lock.json')})
              with gate.directory(fd, 'public') as directory:
                  public = gate.scan(directory)
              with gate.directory(fd, 'dist') as directory:
                  build = gate.scan(directory)
              preview, preview_sha = gate.read_json(fd, 'qa/homepage/results/preview.json')
          finally:
              os.close(fd)
          assert len(source) == 44 and gate.map_sha(source) == '8180dd2ebc2691b4b795bf18ac6e3abd9dcfd21ec7dd35e0c84f6f79bcb22edd', 'Source manifest mismatch'
          assert len(public) == 103 and gate.map_sha(public) == '054d774908eeedf042ef366dc2af3d5921ab2fd25916eb206d2f79ba047048a4', 'Public manifest mismatch'
          assert preview_sha == os.environ['PREVIEW_SHA256'], 'Original preview bytes changed'
          assert preview['createdAt'] == '2026-11-12T15:13:56.241632+00:00', 'Original preview timestamp changed'
          assert len(preview['build']) == 107 and len(build) == 107 and build == preview['build'], 'Full 107-file dist differs from original preview'
          assert all(build.get(name) == digest for name, digest in public.items()), 'Public assets differ from dist'
          source_files = [project / name for name in source]
          assert (project / 'dist/index.html').stat().st_mtime_ns >= max(p.stat().st_mtime_ns for p in source_files), 'Build predates source'
          node = subprocess.check_output(['/opt/imon-runtime/node/bin/node', '--version'], text=True).strip()
          assert node == 'v24.21.0'
          pw = json.loads(pathlib.Path('/home/sergey/.local/share/imon-toolkit/node/node_modules/playwright/package.json').read_text())['version']
          assert pw == '1.58.2'
          entry = {
              'stage': sys.argv[1], 'verifiedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'status': 'pass', 'project': str(project), 'source': source, 'public': public, 'build': build,
              'sourceMapSha256': gate.map_sha(source), 'publicMapSha256': gate.map_sha(public),
              'previewSha256': preview_sha, 'previewCreatedAt': preview['createdAt'], 'qaSha256': expected_qa,
              'nodeVersion': node, 'playwrightVersion': pw, 'platform': platform.platform(),
              'cpuCount': os.cpu_count(),
              'meminfo': {line.split(':', 1)[0]: line.split(':', 1)[1].strip() for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith(('MemTotal:', 'MemAvailable:', 'SwapTotal:', 'SwapFree:'))},
          }
          path = project / ('qa/homepage/results/ci-provenance-' + sys.argv[1] + '.json')
          path.write_text(json.dumps(entry, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps({key: entry[key] for key in ('stage', 'status', 'verifiedAt', 'sourceMapSha256', 'publicMapSha256', 'previewSha256', 'nodeVersion', 'playwrightVersion', 'cpuCount', 'meminfo')}, indent=2))
          PY
          python3 "$RUNNER_TEMP/debteco-ci-verify.py" before-suite 2>&1 | tee qa/homepage/results/ci-preflight.log

      - name: Run the unchanged full 93-case suite
        working-directory: /home/sergey/Projects/DPECO-hover-final-20261112
        run: |
          set -euo pipefail
          python3 -u - <<'PY' 2>&1 | tee qa/homepage/results/ci-full-suite.log
          import datetime, json, os, pathlib, subprocess, sys
          project = pathlib.Path(os.environ['PROJECT'])
          env = {key: value for key, value in os.environ.items() if not key.startswith('QA_') and key not in {'BASE_URL', 'OUT_DIR'}}
          started = datetime.datetime.now(datetime.timezone.utc).isoformat()
          command = ['python3', '-u', str(project / 'qa/homepage/run-client-review-suite.py')]
          record = {'startedAt': started, 'command': command, 'cwd': str(project), 'qaOverridesRemoved': sorted(key for key in os.environ if key.startswith('QA_') or key in {'BASE_URL', 'OUT_DIR'})}
          run = subprocess.run(command, cwd=project, env=env)
          record.update(finishedAt=datetime.datetime.now(datetime.timezone.utc).isoformat(), exitCode=run.returncode)
          (project / 'qa/homepage/results/ci-suite-process.json').write_text(json.dumps(record, indent=2) + '\n')
          sys.exit(run.returncode)
          PY

      - name: Validate unchanged publication gate after the full suite
        working-directory: /home/sergey/Projects/DPECO-hover-final-20261112
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/debteco-ci-verify.py" before-candidate 2>&1 | tee qa/homepage/results/ci-gate-preflight.log
          python3 - <<'PY' 2>&1 | tee qa/homepage/results/ci-candidate.log
          import hashlib, importlib.util, json, os, pathlib, sys
          sys.dont_write_bytecode = True
          project = pathlib.Path(os.environ['PROJECT'])
          script = project / 'qa/homepage/publish-server.py'
          assert hashlib.sha256(script.read_bytes()).hexdigest() == '7dff5609eca4ef58fa2bdc5d430c261d79cf39f6f1dd54addf26ed6464d17c67'
          spec = importlib.util.spec_from_file_location('debteco_unchanged_gate', script)
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          root_fd = os.open('/', gate.DIR_FLAGS)
          try:
              with gate.directory(root_fd, str(project)[1:]) as project_fd, gate.directory(project_fd, 'dist') as dist_fd:
                  verified = gate.candidate(project_fd, dist_fd)
          finally:
              os.close(root_fd)
          (project / 'qa/homepage/results/ci-candidate.json').write_text(json.dumps(verified, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(verified, ensure_ascii=False, indent=2))
          PY

      - name: Record unchanged inputs after QA and preserve raw results
        if: always()
        run: |
          set -uo pipefail
          if test -f "$RUNNER_TEMP/debteco-ci-verify.py" && test -d "$PROJECT/qa/homepage/results"; then
            python3 "$RUNNER_TEMP/debteco-ci-verify.py" after-suite 2>&1 | tee "$PROJECT/qa/homepage/results/ci-postflight.log"
            exit "${PIPESTATUS[0]}"
          fi
          echo "Preflight did not complete; no acceptance is claimed."

      - name: Upload raw QA receipts, reports, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debteco-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: /home/sergey/Projects/DPECO-hover-final-20261112/qa/homepage/results/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
